
services:
  incidentflow-postgres:
    image: postgres:16-alpine
    container_name: incidentflow-postgres
    command: postgres -c shared_buffers=64MB -c max_connections=40 -c work_mem=4MB
    environment:
      POSTGRES_DB: IncidentFlow_db
      POSTGRES_USER: IncidentFlow_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - incidentflow-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  incidentflow-keycloak:
    image: keycloak/keycloak:21.1.1
    container_name: incidentflow-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://incidentflow-postgres:5432/IncidentFlow_db
      KC_DB_USERNAME: IncidentFlow_user
      KC_DB_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS_KC_BUILD: "-Xms128m -Xmx480m -XX:+UseSerialGC"
    ports:
      - "8180:8080"
    depends_on:
      - incidentflow-postgres
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/import
    networks:
      - incidentflow-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 128M

  incidentflow-redis:
    image: redis:7-alpine
    container_name: incidentflow-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - incidentflow-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  incidentflow-backend:
    build: ./backend
    container_name: incidentflow-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://incidentflow-postgres:5432/IncidentFlow_db
      SPRING_DATASOURCE_USERNAME: IncidentFlow_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev-mock
      SPRING_DATA_REDIS_HOST: incidentflow-redis
      SPRING_DATA_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -Xms128m -Xmx384m"
    ports:
      - "8080:8080"
    depends_on:
      - incidentflow-postgres
      - incidentflow-redis
    networks:
      - incidentflow-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  incidentflow-frontend:
    build: ./frontend
    container_name: incidentflow-frontend
    ports:
      - "3000:3000"
    environment:
      # You can add API URLs here if your frontend uses them via env vars
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - incidentflow-backend
    networks:
      - incidentflow-network
    restart: unless-stopped
    volumes:
      # Optional: Bind mount to reflect code changes live during development
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data:

networks:
  incidentflow-network:
    driver: bridge

